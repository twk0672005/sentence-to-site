name: Validate skill library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package structure and public boundaries
        run: |
          python3 scripts/validate_skill_package.py
          python3 tests/validate_skill.py
          python3 tests/validate_skill_library.py
          python3 tests/validate_release_contract.py
      - name: Compile executable utilities
        run: python3 -m py_compile scripts/*.py
