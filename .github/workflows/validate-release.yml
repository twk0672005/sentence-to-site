name: Validate v1.4 workflow kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and deterministic distribution
        run: python -B .github/scripts/validate-release.py
      - name: Run contract regression tests
        run: python -B -m unittest discover -s tests

  browser-smoke:
    needs: contract
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned browser tooling
        run: python -m pip install -r requirements.txt
      - name: Install matching Chromium
        run: python -m playwright install --with-deps chromium
      - name: Dogfood browser verifier and motion recorder
        run: python -B .github/scripts/run-browser-smoke.py
