name: Workflow improvement request
description: Propose a website, animation, evidence, tooling, or optional capability improvement.
title: "workflow: "
labels: ["workflow-request"]
body:
  - type: textarea
    id: trigger
    attributes:
      label: Trigger and user problem
      description: Describe the real task or failure that should load or change this workflow guidance.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Decision boundary
      description: Explain what belongs in the daily workflow and what should remain optional.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Runnable evidence
      description: Describe the positive and negative artifact, viewport, interaction, animation, package, or regression case that can prove the change.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety
      options:
        - label: This request contains no credentials, private client material, absolute local paths, or copied private prompts.
          required: true
