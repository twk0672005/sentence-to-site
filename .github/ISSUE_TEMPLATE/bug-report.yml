name: Bug report
description: Report a reproducible issue with a skill, template, validator, or browser utility.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - website workflow
        - animation / Three.js workflow
        - evidence gate or high-end review
        - browser verifier
        - motion recorder
        - release validator / deterministic package
        - optional skill or source index
        - documentation / checklist / handoff
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe reproduction
      description: Remove credentials, private URLs, client assets, and environment values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version or commit
    validations:
      required: true
