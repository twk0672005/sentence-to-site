name: Bug report
description: Report a reproducible issue with a skill, template, validator, or browser utility.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - cinematic-web-motion router
        - visual-story-direction
        - website-motion-intake
        - motion-choreography
        - browser-evidence
        - delivery-handoff
        - package validator or template
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe reproduction
      description: Remove credentials, private URLs, client assets, and environment values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version or commit
    validations:
      required: true
