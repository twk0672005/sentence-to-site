<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentence to Site Fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: #f7f3e8;
      background: #14120f;
      font-family: system-ui, sans-serif;
      transition: background-color 180ms linear;
    }
    header { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { min-height: 220vh; padding: 48px 8vw; }
    h1 { max-width: 12ch; font-size: clamp(48px, 10vw, 120px); line-height: .92; }
    button { min-height: 48px; padding: 0 24px; border: 2px solid currentColor; color: inherit; background: transparent; }
    button:focus-visible { outline: 4px solid #ffca62; outline-offset: 4px; }
    #orb {
      position: fixed;
      right: 8vw;
      bottom: 8vh;
      width: 96px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ff5a36;
      transform: translate3d(0, 0, 0) scale(.75);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p>Truthful browser evidence</p>
      <h1>Workflow Fixture</h1>
      <button type="button">Primary action</button>
    </div>
  </header>
  <main>
    <h2>Scroll state</h2>
    <p>Start, middle and settled frames must be visibly different.</p>
  </main>
  <div id="orb" aria-hidden="true"></div>
  <script>
    const orb = document.querySelector('#orb');
    function update() {
      const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const progress = Math.min(1, Math.max(0, scrollY / max));
      orb.style.transform = `translate3d(0, ${-progress * 56}vh, 0) scale(${0.75 + progress * 0.7})`;
      document.body.style.backgroundColor = progress > 0.75 ? '#24203a' : progress > 0.25 ? '#1d2931' : '#14120f';
      window.__APP_STATUS__ = { progress, settled: progress > 0.99 };
    }
    addEventListener('scroll', update, { passive: true });
    update();
  </script>
</body>
</html>
